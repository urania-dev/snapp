openapi: 3.1.0
info:
  title: Snapp
  version: 0.9-rc
tags:
  - name: user
    description: Operations for managing users
  - name: session
    description: Operations for managing users sessions
  - name: passwordReset
    description: Operations for managing password resets
  - name: setting
    description: Operations for managing global and user settings
  - name: token
    description: Operations for managing api token
  - name: snapp
    description: Operations for managing short urls
  - name: usage
    description: Operations for managing metrics about snapps
  - name: tag
    description: Operations for managing tags
  - name: group
    description: Operations for managing tags
  - name: vtApiCache
    description: Operations for managing VirusTotal API Cached results
  - name: watchList
    description: Operations for managing bans on names or domains
components:
  schemas:
    UserScalarFieldEnum:
      type: string
      enum:
        - id
        - email
        - username
        - password
        - notes
        - role
        - createdAt
        - updatedAt
        - tfs
        - verified
    SessionScalarFieldEnum:
      type: string
      enum:
        - id
        - userId
        - expiresAt
        - tfs
    PasswordResetScalarFieldEnum:
      type: string
      enum:
        - tokenHash
        - userId
        - expiresAt
    SettingScalarFieldEnum:
      type: string
      enum:
        - id
        - field
        - value
        - userId
        - created
    TokenScalarFieldEnum:
      type: string
      enum:
        - key
        - userId
        - createdAt
    SnappScalarFieldEnum:
      type: string
      enum:
        - id
        - shortcode
        - originalUrl
        - createdAt
        - expiresAt
        - disabled
        - userId
        - groupId
        - utmParams
        - secret
        - maxUsages
        - hit
        - used
        - notes
    UsageScalarFieldEnum:
      type: string
      enum:
        - id
        - timestamp
        - snappId
        - ownerId
        - language
        - userAgent
        - referrer
        - device
        - country
        - region
        - city
        - os
        - browser
        - cpu
    TagScalarFieldEnum:
      type: string
      enum:
        - name
        - slug
        - notes
    GroupScalarFieldEnum:
      type: string
      enum:
        - name
        - slug
        - notes
    VtApiCacheScalarFieldEnum:
      type: string
      enum:
        - id
        - createdAt
        - domain
        - result
    WatchListScalarFieldEnum:
      type: string
      enum:
        - id
        - createdAt
        - username
        - domain
        - allowed
    SortOrder:
      type: string
      enum:
        - asc
        - desc
    NullsOrder:
      type: string
      enum:
        - first
        - last
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
        password:
          type: string
        notes:
          oneOf:
            - type: "null"
            - type: string
        role:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        tfs:
          oneOf:
            - type: "null"
            - type: string
        verified:
          type: boolean
        snapps:
          type: array
          items:
            $ref: "#/components/schemas/Snapp"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        settings:
          type: array
          items:
            $ref: "#/components/schemas/Setting"
        token:
          type: array
          items:
            $ref: "#/components/schemas/Token"
        usages:
          type: array
          items:
            $ref: "#/components/schemas/Usage"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"
      required:
        - id
        - email
        - username
        - password
        - role
        - createdAt
        - updatedAt
        - verified
    Session:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        expiresAt:
          type: string
          format: date-time
        tfs:
          type: boolean
        user:
          $ref: "#/components/schemas/User"
      required:
        - id
        - userId
        - expiresAt
        - tfs
        - user
    PasswordReset:
      type: object
      properties:
        tokenHash:
          type: string
        userId:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - tokenHash
        - userId
        - expiresAt
    Setting:
      type: object
      properties:
        id:
          type: string
        field:
          type: string
        value:
          type: string
        userId:
          oneOf:
            - type: "null"
            - type: string
        user:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/User"
        created:
          type: string
          format: date-time
      required:
        - id
        - field
        - value
        - created
    Token:
      type: object
      properties:
        key:
          type: string
        userId:
          type: string
        createdAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
      required:
        - key
        - userId
        - createdAt
        - user
    Snapp:
      type: object
      properties:
        id:
          type: string
        shortcode:
          type: string
        originalUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          oneOf:
            - type: "null"
            - type: string
              format: date-time
        disabled:
          type: boolean
        userId:
          type: string
        groupId:
          oneOf:
            - type: "null"
            - type: string
        utmParams:
          oneOf:
            - type: "null"
            - type: string
        secret:
          oneOf:
            - type: "null"
            - type: string
        maxUsages:
          type: integer
        hit:
          type: integer
        used:
          type: integer
        notes:
          oneOf:
            - type: "null"
            - type: string
        tag:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        usages:
          type: array
          items:
            $ref: "#/components/schemas/Usage"
        user:
          $ref: "#/components/schemas/User"
        group:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Group"
      required:
        - id
        - shortcode
        - originalUrl
        - createdAt
        - disabled
        - userId
        - maxUsages
        - hit
        - used
        - user
    Usage:
      type: object
      properties:
        id:
          type: integer
        timestamp:
          type: string
          format: date-time
        snappId:
          type: string
        ownerId:
          type: string
        language:
          oneOf:
            - type: "null"
            - type: string
        userAgent:
          oneOf:
            - type: "null"
            - type: string
        referrer:
          oneOf:
            - type: "null"
            - type: string
        device:
          oneOf:
            - type: "null"
            - type: string
        country:
          oneOf:
            - type: "null"
            - type: string
        region:
          oneOf:
            - type: "null"
            - type: string
        city:
          oneOf:
            - type: "null"
            - type: string
        os:
          oneOf:
            - type: "null"
            - type: string
        browser:
