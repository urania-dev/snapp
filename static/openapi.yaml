              items:
                $ref: "#/components/schemas/UserWhereInput"
        id:
          oneOf:
            - $ref: "#/components/schemas/StringFilter"
            - type: string
        email:
          oneOf:
            - $ref: "#/components/schemas/StringFilter"
            - type: string
        username:
          oneOf:
            - $ref: "#/components/schemas/StringFilter"
            - type: string
        password:
          oneOf:
            - $ref: "#/components/schemas/StringFilter"
